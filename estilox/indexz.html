<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilox.css">
</head>
<body>
    <header>
        <div class="contenedor">
            <h1>Diseño <span>Multimedia</span></h1>
            <nav>
                <a href="#">INICIO</a>
                <a href="#">NOSOTROS</a>
                <a href="#">SERVICIOS</a>
                <a href="#" class="activo">CONTACTO</a>
            </nav>
        </div>
    </header>

    <section class="boletin">
        <div class="contenedor">
            <h2>Suscribete a nuestro boletín</h2>
            <form>
                <input type="email" placeholder="Ingrese el Email...">
                <button type="submit">Suscribirse</button>
            </form>
        </div>
    </section>

    <main class="contenido">
        <section class="formulario-contacto"> 
            <h2>Contacto</h2>
            <form>
                <input type="text" placeholder="Ingresa tu nombre" required>
                <input type="email" placeholder="Ingresa tu email" required>
                <input type="text" placeholder="Ingresa tu teléfono">
                <input type="text" placeholder="Ingresa tu celular">
                <textarea placeholder="Ingresa tu mensaje" rows="6"></textarea>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <aside>
            <div class="info">
                <h3>Que hacemos</h3>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec varius auctor lacus nec feugiat.</p>
            </div>
            <div class="mapa">
                <img src="images/images/mapaGoogle.png" alt="Mapa">
            </div>
        </aside>
    </main>

    <footer>
        <p>Graphel Desarrollo Web, Copyright © 2017</p>
    </footer>
</body>
</html>
